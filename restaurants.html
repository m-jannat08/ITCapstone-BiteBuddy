<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore Restaurants | BiteBuddy</title>

<style>
:root {
  --green: #003D2E;
  --deep: #002F24;
  --lime: #8AF23A;
  --cream: #F8F6EF;
  --ink: #16352C;
  --muted: #64736B;
  --line: #DDE7DF;
  --soft: #E9F8D9;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--cream);
  color: var(--ink);
  font: 15px/1.55 Arial, Helvetica, sans-serif;
}

h1, h2, p { margin: 0; }
h1, h2 { color: var(--green); line-height: 1.25; }
a { text-decoration: none; }
button, select { font: inherit; }

.navbar {
  min-height: 76px;
  padding: 12px 35px;
  background: var(--green);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.logo-image {
  width: 105px;
  height: 55px;
  object-fit: contain;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 25px;
  flex-wrap: wrap;
}

.nav-links a {
  color: #DCE8E1;
  font-size: 13px;
}

.nav-links a:hover,
.nav-links .active { color: var(--lime); }

.wrap {
  max-width: 1256px;
  margin: 0 auto;
  padding: 0 28px;
}

main.wrap {
  padding-top: 32px;
  padding-bottom: 70px;
}

.page-heading { margin-bottom: 28px; }

h1 {
  font-size: clamp(30px, 4vw, 43px);
  font-weight: 800;
  letter-spacing: -1px;
}

.page-heading p {
  color: var(--muted);
  margin-top: 10px;
}

.filters {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  padding: 20px;
  background: white;
  border: 1px solid var(--line);
  border-radius: 17px;
  margin-bottom: 12px;
}

.filter {
  display: flex;
  flex-direction: column;
  gap: 7px;
  min-width: 0;
}

.filter label {
  font-size: 12px;
  font-weight: 700;
}

.filter select {
  width: 100%;
  height: 44px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: white;
  padding: 0 10px;
  color: var(--green);
  font-size: 12px;
}

.filter-note {
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 25px;
}

.results-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.results-bar strong { font-size: 13px; }

.clear-filters {
  border: 0;
  background: transparent;
  color: var(--green);
  text-decoration: underline;
  cursor: pointer;
  font-size: 12px;
  margin-left: 10px;
}

.sort-field {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
}

.sort-field select {
  border: 0;
  background: transparent;
  color: var(--green);
  padding: 6px;
}

.results-context {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 15px;
}

.restaurant-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
}

.restaurant-card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 8px 28px rgba(0,61,46,.045);
  display: grid;
  grid-template-columns: 150px minmax(0,1fr);
  min-height: 285px;
}

.restaurant-card:hover {
  border-color: #B9CDB7;
  box-shadow: 0 8px 25px rgba(0,61,46,.09);
}

.restaurant-visual {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
  border-right: 1px solid var(--line);
  min-height: 200px;
  overflow: hidden;
}

.restaurant-visual img {
  width: 100%;
  max-height: 180px;
  object-fit: contain;
}

.logo-fallback {
  display: none;
  text-align: center;
  font-weight: 800;
  font-size: 17px;
  color: var(--green);
  overflow-wrap: anywhere;
}

.restaurant-info {
  padding: 22px 18px;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.restaurant-title {
  font-size: 20px;
  margin-bottom: 6px;
}

.cuisine-meta {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 13px;
}

.restaurant-description {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.6;
}

.restaurant-facts {
  display: flex;
  align-items: center;
  gap: 13px;
  margin: 17px 0 14px;
  flex-wrap: wrap;
}

.price-line {
  font-size: 23px;
  font-weight: 700;
  color: var(--green);
}

.distance-line {
  font-size: 12px;
  color: var(--muted);
  border-left: 1px solid var(--line);
  padding-left: 13px;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 18px;
}

.badge {
  display: inline-flex;
  padding: 5px 9px;
  border-radius: 20px;
  background: var(--soft);
  color: var(--green);
  font-size: 11px;
  font-weight: 700;
}

.badge.limited {
  background: #FFF0DC;
  color: #79551D;
}

.restaurant-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: auto;
  padding-top: 16px;
  border-top: 1px solid #EDF0E9;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 42px;
  padding: 9px 17px;
  border: 1px solid var(--green);
  border-radius: 25px;
  background: var(--green);
  color: white;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.btn:hover { background: var(--deep); }

.empty-state {
  padding: 45px 20px;
  text-align: center;
  border: 1px dashed #BCCAAF;
  border-radius: 19px;
  background: #FCFCF6;
  grid-column: 1 / -1;
}

.empty-state h2 { font-size: 20px; }

.empty-state p {
  color: var(--muted);
  margin: 10px 0 18px;
}

@media (max-width: 900px) {
  .filters { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .restaurant-grid { grid-template-columns: 1fr; }
}

@media (max-width: 520px) {
  .navbar { padding: 12px 16px; }
  .nav-links { gap: 12px; }
  .nav-links a { font-size: 11px; }
  .wrap { padding: 0 14px; }
  .restaurant-card { grid-template-columns: 105px minmax(0,1fr); }
  .restaurant-visual { padding: 8px; }
  .restaurant-info { padding: 17px 12px; }
  .restaurant-title { font-size: 17px; }
  .restaurant-description { font-size: 12px; }
  .distance-line { padding-left: 8px; font-size: 10px; }
  .badge { font-size: 10px; padding: 5px 7px; }
}
</style>
</head>

<header class="navbar">
  <a href="home.html" aria-label="BiteBuddy home">
    <img src="bitebuddy-logo.png" class="logo-image" alt="BiteBuddy logo">
  </a>

  <nav class="nav-links" aria-label="Main navigation">
    <a href="home.html">Home</a>
    <a href="Create-Group.html">Create Group</a>

    <a href="restaurants.html" class="active">Restaurants</a>

<main class="wrap">
  <section class="page-heading">
    <h1>Explore restaurants</h1>
    <p>Discover restaurants, compare prices, and find food that fits your group's preferences.</p>
  </section>

  <section class="filters" aria-label="Filter restaurants">
    <div class="filter">
      <label for="cuisineFilter">Cuisine</label>
      <select id="cuisineFilter">
        <option value="">All cuisines</option>
      </select>
    </div>

    <div class="filter">
      <label for="priceFilter">Price</label>
      <select id="priceFilter">
        <option value="">Any price</option>
        <option value="1">$ Cheap</option>
        <option value="2">$$ Moderate</option>
        <option value="3">$$$ Expensive</option>
      </select>
    </div>

    <div class="filter">
      <label for="dietaryFilter">Dietary options &amp; allergies</label>
      <select id="dietaryFilter">
        <option value="">All options</option>
        <option value="vegetarian">Vegetarian</option>
        <option value="vegan">Vegan</option>
        <option value="glutenFree">Gluten-free</option>
        <option value="halal">Halal</option>
        <option value="nutFree">Nut-free</option>
        <option value="soyFree">Soy-free</option>
        <option value="dairyFree">Dairy-free</option>
        <option value="eggFree">Egg-free</option>
        <option value="peanutFree">Peanut-free</option>
        <option value="shellfishFree">Shellfish-free</option>
        <option value="wheatFree">Wheat-free</option>
      </select>
    </div>

    <div class="filter">
      <label for="distanceFilter">Distance</label>
      <select id="distanceFilter">
        <option value="">Any distance</option>
        <option value="1">Within 1 mile</option>
        <option value="2">Within 2 miles</option>
        <option value="5">Within 5 miles</option>
        <option value="10">Within 10 miles</option>
      </select>
    </div>
  </section>

  <p class="filter-note">
    $ = cheap, $$ = moderate, $$$ = expensive.
    Dietary options and allergy accommodations must be confirmed with each restaurant.
  </p>

  <div class="results-bar">
    <div>
      <strong id="resultCount" role="status" aria-live="polite"></strong>
      <button class="clear-filters" type="button" id="clearFilters" hidden>
        Clear filters
      </button>
    </div>

    <label class="sort-field" for="sortSelect">
      Sort
      <select id="sortSelect">
        <option value="default">Our starter list</option>
        <option value="distance">Nearest first</option>
        <option value="price">Price: low to high</option>
        <option value="name">Name A–Z</option>
      </select>
    </label>
  </div>

  <p class="results-context" id="resultsContext" hidden></p>
  <div class="restaurant-grid" id="restaurantGrid"></div>
</main>

const dietNames = {
  vegetarian: "Vegetarian",
  vegan: "Vegan",
  glutenFree: "Gluten-free",
  halal: "Halal",
  nutFree: "Nut-free",
  soyFree: "Soy-free",
  dairyFree: "Dairy-free",
  eggFree: "Egg-free",
  peanutFree: "Peanut-free",
  shellfishFree: "Shellfish-free",
  wheatFree: "Wheat-free"
};

const byId = id => document.getElementById(id);

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

function priceSymbols(restaurant) {
  const level = Number(restaurant.price?.level);
  return Number.isInteger(level) && level >= 1 && level <= 3
    ? "$".repeat(level)
    : "Price varies";
}

function renderBadge(restaurant, key) {
  const status = restaurant.dietary?.[key];

  if (!["yes", "limited"].includes(status)) return "";

  const label = (dietNames[key] || key) +
    (status === "limited" ? " · limited" : " options");

  return `<span class="badge ${status === "limited" ? "limited" : ""}">
    ${status === "yes" ? "✓ " : ""}${escapeHTML(label)}
  </span>`;
}

function readFilters() {
  return {
    cuisine: byId("cuisineFilter").value,
    price: Number(byId("priceFilter").value) || null,
    diet: byId("dietaryFilter").value,
    distance: Number(byId("distanceFilter").value) || null,
    sort: byId("sortSelect").value
  };
}

function selectRestaurants(filters) {
  let items = restaurantData.restaurants.filter(restaurant => {
    const cuisines = Array.isArray(restaurant.cuisines)
      ? restaurant.cuisines
      : [];

    if (filters.cuisine && !cuisines.includes(filters.cuisine)) {
      return false;
    }

    if (
      filters.diet &&
      !["yes", "limited"].includes(restaurant.dietary?.[filters.diet])
    ) {
      return false;
    }

    if (
      filters.distance &&
      (restaurant.distanceMiles == null ||
       restaurant.distanceMiles > filters.distance)
    ) {
      return false;
    }

    if (filters.price && restaurant.price?.level !== filters.price) {
      return false;
    }

    return true;
  });

  const sorters = {
    name: (a, b) => a.name.localeCompare(b.name),
    distance: (a, b) =>
      (a.distanceMiles ?? Infinity) - (b.distanceMiles ?? Infinity),
    price: (a, b) =>
      (a.price?.level ?? Infinity) - (b.price?.level ?? Infinity) ||
      (a.price?.min ?? Infinity) - (b.price?.min ?? Infinity)
  };

  if (sorters[filters.sort]) {
    items.sort(sorters[filters.sort]);
  }

  return items;
}

function renderCard(restaurant, filters) {
  const dietaryKeys = [
    filters.diet,
    "vegetarian",
    "halal",
    "vegan",
    "glutenFree",
    "nutFree",
    "soyFree",
    "dairyFree",
    "eggFree",
    "peanutFree",
    "shellfishFree",
    "wheatFree"
  ].filter((key, index, array) =>
    key && array.indexOf(key) === index
  );

  const badges = dietaryKeys
    .map(key => renderBadge(restaurant, key))
    .join("");

  const distanceText = restaurant.distanceMiles == null
    ? "Distance not confirmed"
    : `${Number(restaurant.distanceMiles).toFixed(1)} mi`;

  const imageUrl = restaurant.imageUrl || "";
  const menuUrl = restaurant.menuUrl || "#";
  const cuisines = Array.isArray(restaurant.cuisines)
    ? restaurant.cuisines.join(" · ")
    : "Cuisine not listed";

  return `
    <article class="restaurant-card">
      <div class="restaurant-visual"
        style="background:${escapeHTML(restaurant.imageBackground || "#ffffff")}">

        <img
          src="${escapeHTML(imageUrl)}"
          alt="${escapeHTML(restaurant.name)}"
          loading="lazy"
          onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
          style="${imageUrl ? "" : "display:none"}">

        <div class="logo-fallback"
          style="${imageUrl ? "" : "display:block"}">
          ${escapeHTML(restaurant.name)}
        </div>
      </div>

      <div class="restaurant-info">
        <h2 class="restaurant-title">${escapeHTML(restaurant.name)}</h2>

        <p class="cuisine-meta">${escapeHTML(cuisines)}</p>

        <p class="restaurant-description">
          ${escapeHTML(restaurant.description)}
        </p>

        <div class="restaurant-facts">
          <p class="price-line">${priceSymbols(restaurant)}</p>
          <p class="distance-line">◎ ${escapeHTML(distanceText)}</p>
        </div>

        <div class="tags">${badges}</div>

        <div class="restaurant-actions">
          <a class="btn"
            href="${escapeHTML(menuUrl)}"
            target="_blank"
            rel="noopener noreferrer">
            View menu ↗
          </a>
        </div>
      </div>
    </article>
  `;
}

function renderRestaurants() {
  const filters = readFilters();
  const items = selectRestaurants(filters);

  byId("resultCount").textContent =
    `${items.length} ${items.length === 1 ? "restaurant" : "restaurants"} to explore`;

  const active = Boolean(
    filters.cuisine || filters.price || filters.diet || filters.distance
  );

  byId("clearFilters").hidden = !active;

  byId("resultsContext").textContent = filters.diet
    ? "Dietary information is preliminary. Confirm ingredients and cross-contact with the restaurant."
    : "";

  byId("resultsContext").hidden = !filters.diet;

  if (items.length) {
    byId("restaurantGrid").innerHTML = items
      .map(restaurant => renderCard(restaurant, filters))
      .join("");
  } else {
    byId("restaurantGrid").innerHTML = `
      <section class="empty-state">
        <h2>No matching restaurants</h2>
        <p>Try another cuisine, a different budget, or a wider distance.</p>
        <button class="btn" type="button" id="emptyClear">
          Clear filters
        </button>
      </section>`;
  }
}

function clearFilters() {
  ["cuisineFilter", "priceFilter", "dietaryFilter", "distanceFilter"]
    .forEach(id => byId(id).value = "");

  byId("sortSelect").value = "default";
  renderRestaurants();
}

function initializeRestaurants() {
  const cuisines = [
    ...new Set(
      restaurantData.restaurants.flatMap(restaurant =>
        Array.isArray(restaurant.cuisines)
          ? restaurant.cuisines
          : []
      )
    )
  ].sort();

  cuisines.forEach(cuisine => {
    byId("cuisineFilter").add(new Option(cuisine, cuisine));
  });

  [
    "cuisineFilter",
    "priceFilter",
    "dietaryFilter",
    "distanceFilter",
    "sortSelect"
  ].forEach(id => {
    byId(id).addEventListener("change", renderRestaurants);
  });

  byId("clearFilters").addEventListener("click", clearFilters);

  byId("restaurantGrid").addEventListener("click", event => {
    if (event.target.closest("#emptyClear")) {
      clearFilters();
    }
  });

  renderRestaurants();
}

initializeRestaurants();
</script>
