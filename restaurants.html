/* Resturant logo picture */
.restaurant-card {
    display: grid;
    grid-template-columns: 146px minmax(0, 1fr);
    min-height: 0;
    border-radius: 18px;
    transition: box-shadow .15s, border-color .15s;
}

.restaurant-card:hover {
    border-color: #b9cdb7;
    box-shadow: 0 8px 25px rgba(0, 61, 46, .07);
}

.restaurant-visual {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 17px;
    border-right: 1px solid var(--line);
    position: relative;
    min-height: 170px;
}

.restaurant-visual img {
    position: static;
    width: 100%;
    height: auto;
    max-height: 190px;
    object-fit: contain;
}

.restaurant-visual[data-kind="food"] {
    padding: 0;
}

.restaurant-visual[data-kind="food"] img {
    position: absolute;
    inset: 0;
    height: 100%;
    max-height: none;
    object-fit: cover;
}

.restaurant-info {
    height: 100%;
    padding: 23px 19px 21px;
}

.restaurant-title {
    font-size: 19px;
    padding-right: 0;
    margin-bottom: 6px;
    line-height: 1.3;
}

.cuisine-meta {
    font-size: 12px;
    margin-bottom: 13px;
    color: #637460;
}

.restaurant-description {
    font-size: 12px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0;
    max-width: 440px;
}

.restaurant-facts {
    display: flex;
    align-items: center;
    gap: 15px;
    margin: 17px 0 14px;
}

.restaurant-facts .price-line {
    font-size: 22px;
    line-height: 1.2;
    letter-spacing: 1px;
}

.restaurant-facts .distance-line {
    font-size: 12px;
    margin: 0;
    border-left: 1px solid var(--line);
    padding-left: 15px;
    min-height: 22px;
}

.restaurant-facts .distance-line svg {
    width: 14px;
    height: 14px;
}

.restaurant-card .tags {
    min-height: 26px;
    margin-bottom: 20px;
    gap: 6px;
}

.restaurant-card .badge {
    font-size: 11px;
    padding: 5px 10px;
}

.restaurant-card .restaurant-actions {
    padding-top: 16px;
    border-top: 1px solid #edf0e9;
    gap: 8px;
}

.restaurant-card .restaurant-actions .btn {
    min-height: 41px;
    padding: 9px 16px;
    font-size: 12px;
}

@media (max-width: 1050px) {
    .restaurant-card {
        grid-template-columns: 126px minmax(0, 1fr);
    }

    .restaurant-visual {
        padding: 13px;
    }

    .restaurant-info {
        padding: 21px 16px 19px;
    }

    .restaurant-title {
        font-size: 18px;
    }

    .restaurant-card .restaurant-actions .btn {
        font-size: 11px;
        padding: 9px 12px;
    }
}

@media (max-width: 760px) {
    .restaurant-card {
        grid-template-columns: 148px minmax(0, 1fr);
    }

    .restaurant-visual {
        padding: 19px;
    }

    .restaurant-info {
        padding: 24px 21px 22px;
    }

    .restaurant-title {
        font-size: 20px;
    }

    .restaurant-card .restaurant-actions .btn {
        font-size: 12px;
        padding: 9px 15px;
    }
}

@media (max-width: 480px) {
    .restaurant-card {
        grid-template-columns: 100px minmax(0, 1fr);
    }

    .restaurant-visual {
        padding: 11px;
    }

    .restaurant-info {
        padding: 21px 14px 19px;
    }

    .restaurant-title {
        font-size: 17px;
        padding-right: 0;
    }

    .restaurant-description {
        font-size: 12px;
    }

    .restaurant-card .badge {
        font-size: 10px;
    }

    .restaurant-card .restaurant-actions .btn {
        font-size: 11px;
        padding: 9px 12px;
    }

    .restaurant-facts {
        gap: 11px;
    }

    .restaurant-facts .distance-line {
        padding-left: 11px;
        font-size: 11px;
    }
}

<script>
'use strict';


const restaurantData = JSON.parse(document.getElementById('restaurant-data').textContent);
const restaurants = restaurantData.restaurants;
const dietNames = { vegetarian:'Vegetarian', vegan:'Vegan', glutenFree:'Gluten-free', halal:'Halal' };
const state = { images:{} };
const byId = id => document.getElementById(id);
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const icon = name => `<svg aria-hidden="true"><use href="#i-${name}"></use></svg>`;
// price point
const priceLevel = restaurant => restaurant.price.level;
const priceSymbols = restaurant => '$'.repeat(priceLevel(restaurant));
const priceLabels = { 1:'cheap', 2:'moderate', 3:'expensive' };
const externalLink = url => { try { const parsed = new URL(url); return /^https?:$/.test(parsed.protocol) ? parsed.href : '#'; } catch { return '#'; } };
const externalAttrs = 'target="_blank" rel="noopener noreferrer"';
const imageBackground = restaurant => /^#[\da-f]{6}$/i.test(restaurant.imageBackground) ? restaurant.imageBackground : '#ffffff';
const imageKind = restaurant => restaurant.imageKind === 'food' ? 'food' : 'logo';

function dietaryStatus(restaurant, key) {
  return restaurant.dietary[key];
}
function readFilters() {
  return { cuisine:byId('cuisineFilter').value,
    price:Number(byId('priceFilter').value) || null, diet:byId('dietaryFilter').value,
    distance:Number(byId('distanceFilter').value) || null, sort:byId('sortSelect').value };
}
function selectRestaurants(filters) {
  let items = restaurants.filter(restaurant => {
    if (filters.cuisine && !restaurant.cuisines.includes(filters.cuisine)) return false;
    if (filters.diet && !['yes','limited'].includes(dietaryStatus(restaurant,filters.diet))) return false;
    if (filters.distance && (restaurant.distanceMiles === null || restaurant.distanceMiles > filters.distance)) return false;
    if (filters.price && priceLevel(restaurant) !== filters.price) return false;
    return true;
  });
  const sorters = {name:(a,b) => a.name.localeCompare(b.name),distance:(a,b) => (a.distanceMiles ?? Infinity)-(b.distanceMiles ?? Infinity),price:(a,b) => priceLevel(a)-priceLevel(b) || (a.price.min+a.price.max)-(b.price.min+b.price.max)};
  if (sorters[filters.sort]) items.sort(sorters[filters.sort]);
  return items;
}
function renderBadge(restaurant,key) {
  const status = dietaryStatus(restaurant,key);
  const label = dietNames[key] + (status === 'limited' ? ' · limited' : ' options');
  return `<span class="badge ${status === 'limited' ? 'limited' : ''}">${status === 'yes' ? icon('check') : ''}${escapeHTML(label)}</span>`;
}
function renderCard(restaurant,filters) {
  const badgeKeys = [filters.diet,...['vegetarian','halal','vegan','glutenFree']].filter((key,index,array) => key && array.indexOf(key) === index && ['yes','limited'].includes(dietaryStatus(restaurant,key)));
  return `<article class="restaurant-card" aria-labelledby="title-${restaurant.id}">
    <div class="restaurant-visual" data-kind="${imageKind(restaurant)}" style="background:${imageBackground(restaurant)}"><img src="${state.images[restaurant.id]}" alt="${escapeHTML(restaurant.imageAlt)}" loading="lazy" decoding="async"></div>
    <div class="restaurant-info">
      <h2 class="restaurant-title" id="title-${restaurant.id}">${escapeHTML(restaurant.name)}</h2>
      <p class="cuisine-meta">${escapeHTML(restaurant.cuisines.join(' · '))}</p>
      <p class="restaurant-description">${escapeHTML(restaurant.description)}</p>
      <div class="restaurant-facts"><p class="price-line" aria-label="Price level: ${priceLabels[priceLevel(restaurant)]}">${priceSymbols(restaurant)}</p>
      <p class="distance-line">${icon('location')}${restaurant.distanceMiles === null ? 'Distance not confirmed' : `${restaurant.distanceMiles.toFixed(1)} mi`}</p></div>
      <div class="tags">${badgeKeys.map(key => renderBadge(restaurant,key)).join('')}</div>
      <div class="restaurant-actions"><a class="btn btn-green" href="${escapeHTML(externalLink(restaurant.menuUrl))}" ${externalAttrs} aria-label="View menu for ${escapeHTML(restaurant.name)} (opens in new tab)">View menu ${icon('external')}</a></div>
    </div>
  </article>`;
}
function renderRestaurants() {
  const filters = readFilters();
  const items = selectRestaurants(filters);
  byId('resultCount').textContent = `${items.length} ${items.length === 1 ? 'restaurant' : 'restaurants'} to explore`;
  const active = Boolean(filters.cuisine || filters.price || filters.diet || filters.distance);
  byId('clearFilters').hidden = !active;
  const context = [];
  if (filters.diet) context.push(`${dietNames[filters.diet]} results include limited choices; unconfirmed options are hidden.`);
  byId('resultsContext').textContent = context.join(' ');
  byId('resultsContext').hidden = !context.length;
  byId('restaurantGrid').innerHTML = items.length ? items.map(item => renderCard(item,filters)).join('') : `<section class="empty-state">${icon('search')}<h2>No matches just yet</h2><p>Try another cuisine, a different budget, or a wider distance. The list has six restaurants for now.</p>${active ? '<button class="btn btn-green" type="button" data-clear>Clear filters</button>' : ''}</section>`;
}
function clearFilters() {
  ['cuisineFilter','priceFilter','dietaryFilter','distanceFilter'].forEach(id => {byId(id).value = '';});
  renderRestaurants();byId('cuisineFilter').focus();
}
function initializeRestaurants() {
  state.images = JSON.parse(byId('restaurant-images').textContent);
  [...new Set(restaurants.flatMap(item => item.cuisines))].sort().forEach(cuisine => byId('cuisineFilter').add(new Option(cuisine,cuisine)));
  ['cuisineFilter','priceFilter','dietaryFilter','distanceFilter','sortSelect'].forEach(id => byId(id).addEventListener('change',() => renderRestaurants()));
  byId('clearFilters').addEventListener('click',clearFilters);
  byId('restaurantGrid').addEventListener('click',event => {
    if (event.target.closest('[data-clear]')) clearFilters();
  });
  renderRestaurants();
}

</script>
