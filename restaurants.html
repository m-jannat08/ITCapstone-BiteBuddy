/* Official restaurant images are fitted without cropping their logos. */
.restaurant-card{display:grid;grid-template-columns:146px minmax(0,1fr);min-height:0;border-radius:18px;transition:box-shadow .15s,border-color .15s}
.restaurant-card:hover{border-color:#b9cdb7;box-shadow:0 8px 25px rgba(0,61,46,.07)}
.restaurant-visual{display:flex;align-items:center;justify-content:center;padding:17px;border-right:1px solid var(--line);position:relative;min-height:170px}
.restaurant-visual img{position:static;width:100%;height:auto;max-height:190px;object-fit:contain}
.restaurant-visual[data-kind="food"]{padding:0}
.restaurant-visual[data-kind="food"] img{position:absolute;inset:0;height:100%;max-height:none;object-fit:cover}
.restaurant-info{height:100%;padding:23px 19px 21px}
.restaurant-title{font-size:19px;padding-right:0;margin-bottom:6px;line-height:1.3}
.cuisine-meta{font-size:12px;margin-bottom:13px;color:#637460}
.restaurant-description{font-size:12px;line-height:1.6;color:var(--muted);margin:0;max-width:440px}
.restaurant-facts{display:flex;align-items:center;gap:15px;margin:17px 0 14px}
.restaurant-facts .price-line{font-size:22px;line-height:1.2;letter-spacing:1px}
.restaurant-facts .distance-line{font-size:12px;margin:0;border-left:1px solid var(--line);padding-left:15px;min-height:22px}
.restaurant-facts .distance-line svg{width:14px;height:14px}
.restaurant-card .tags{min-height:26px;margin-bottom:20px;gap:6px}

<!-- Page behavior: filters, sorting and restaurant details. -->
<script>
'use strict';

// All restaurant content is editable in the JSON block above. No API is required.
const restaurantData = JSON.parse(document.getElementById('restaurant-data').textContent);
const restaurants = restaurantData.restaurants;
const origin = restaurantData.origin;
const dietNames = { vegetarian:'Vegetarian', vegan:'Vegan', glutenFree:'Gluten-free', halal:'Halal' };
const statusNames = { yes:'Options available', limited:'Limited options', no:'Not available', unknown:'Not confirmed' };
const state = { images:{}, lastDetailTrigger:null };
const byId = id => document.getElementById(id);
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const icon = name => `<svg aria-hidden="true"><use href="#i-${name}"></use></svg>`;
const money = value => '$' + Number(value).toFixed(2).replace(/\.00$/, '');
// Relative meal-price tiers for this list: midpoint up to $15 / $20 / above $20.
const priceLevel = restaurant => restaurant.price.level;
const priceSymbols = restaurant => '$'.repeat(priceLevel(restaurant));
const priceLabels = { 1:'cheap', 2:'moderate', 3:'expensive' };
const externalLink = url => { try { const parsed = new URL(url); return /^https?:$/.test(parsed.protocol) ? parsed.href : '#'; } catch { return '#'; } };
const externalAttrs = 'target="_blank" rel="noopener noreferrer"';
const imageBackground = restaurant => /^#[\da-f]{6}$/i.test(restaurant.imageBackground) ? restaurant.imageBackground : '#ffffff';
const imageKind = restaurant => restaurant.imageKind === 'food' ? 'food' : 'logo';

// An explicitly labeled menu item can supplement an unspecified student note.
function dietaryStatus(restaurant, key) {
  const status = restaurant.dietary[key];
  return status === 'unknown' && restaurant.sampleMeals.some(meal => meal.dietary.includes(key)) ? 'limited' : status;
}
function readFilters() {
  return { cuisine:byId('cuisineFilter').value,
    price:Number(byId('priceFilter').value) || null, diet:byId('dietaryFilter').value,
    distance:Number(byId('distanceFilter').value) || null, sort:byId('sortSelect').value };
}
function selectRestaurants(filters) {
  let items = restaurants.filter(restaurant => {
    if (filters.cuisine && !restaurant.cuisines.includes(filters.cuisine)) return false;
    if (filters.diet && !['yes','limited'].includes(dietaryStatus(restaurant,filters.diet))) return false;
    if (filters.distance && (restaurant.distanceMiles === null || restaurant.distanceMiles > filters.distance)) return false;
    if (filters.price && priceLevel(restaurant) !== filters.price) return false;
    return true;
  });
  const sorters = {name:(a,b) => a.name.localeCompare(b.name),distance:(a,b) => (a.distanceMiles ?? Infinity)-(b.distanceMiles ?? Infinity),price:(a,b) => priceLevel(a)-priceLevel(b) || (a.price.min+a.price.max)-(b.price.min+b.price.max)};
  if (sorters[filters.sort]) items.sort(sorters[filters.sort]);
  return items;
}
function renderBadge(restaurant,key) {
  const status = dietaryStatus(restaurant,key);
  const label = dietNames[key] + (status === 'limited' ? ' · limited' : ' options');
  return `<span class="badge ${status === 'limited' ? 'limited' : ''}">${status === 'yes' ? icon('check') : ''}${escapeHTML(label)}</span>`;
}
function renderCard(restaurant,filters) {
  const badgeKeys = [filters.diet,...['vegetarian','halal','vegan','glutenFree']].filter((key,index,array) => key && array.indexOf(key) === index && ['yes','limited'].includes(dietaryStatus(restaurant,key))).slice(0,2);
  return `<article class="restaurant-card" aria-labelledby="title-${restaurant.id}">
    <div class="restaurant-visual" data-kind="${imageKind(restaurant)}" style="background:${imageBackground(restaurant)}"><img src="${state.images[restaurant.id]}" alt="${escapeHTML(restaurant.imageAlt)}" loading="lazy" decoding="async"></div>
    <div class="restaurant-info">
      <h2 class="restaurant-title" id="title-${restaurant.id}">${escapeHTML(restaurant.name)}</h2>
      <p class="cuisine-meta">${escapeHTML(restaurant.cuisines.join(' · '))}</p>
      <p class="restaurant-description">${escapeHTML(restaurant.description)}</p>
      <div class="restaurant-facts"><p class="price-line" aria-label="Price level: ${priceLabels[priceLevel(restaurant)]}">${priceSymbols(restaurant)}</p>
      <p class="distance-line">${icon('location')}${restaurant.distanceMiles === null ? 'Distance not confirmed' : `${restaurant.distanceMiles.toFixed(1)} mi`}</p></div>
      <div class="tags">${badgeKeys.map(key => renderBadge(restaurant,key)).join('')}</div>
      <div class="restaurant-actions"><a class="btn btn-green" href="${escapeHTML(externalLink(restaurant.menuUrl))}" ${externalAttrs} aria-label="View menu for ${escapeHTML(restaurant.name)} (opens in new tab)">View menu ${icon('external')}</a><button class="btn" type="button" data-details="${restaurant.id}" aria-label="Details for ${escapeHTML(restaurant.name)}">Details ${icon('arrow')}</button></div>
    </div>
  </article>`;
}
function renderRestaurants() {
  const filters = readFilters();
  const items = selectRestaurants(filters);
  byId('resultCount').textContent = `${items.length} ${items.length === 1 ? 'restaurant' : 'restaurants'} to explore`;
  const active = Boolean(filters.cuisine || filters.price || filters.diet || filters.distance);
  byId('clearFilters').hidden = !active;
  const context = [];
  if (filters.diet) context.push(`${dietNames[filters.diet]} results include limited choices; unconfirmed options are hidden.`);
  byId('resultsContext').textContent = context.join(' ');
  byId('resultsContext').hidden = !context.length;
  byId('restaurantGrid').innerHTML = items.length ? items.map(item => renderCard(item,filters)).join('') : `<section class="empty-state">${icon('search')}<h2>No matches just yet</h2><p>Try another cuisine, a different budget, or a wider distance. The list has six restaurants for now.</p>${active ? '<button class="btn btn-green" type="button" data-clear>Clear filters</button>' : ''}</section>`;
}
function clearFilters() {
  ['cuisineFilter','priceFilter','dietaryFilter','distanceFilter'].forEach(id => {byId(id).value = '';});
  renderRestaurants();byId('cuisineFilter').focus();
}
function showDetails(id,trigger) {
  const restaurant = restaurants.find(item => item.id === id);if (!restaurant) return;
  state.lastDetailTrigger = trigger;
  const directions = new URL('https://www.google.com/maps/dir/');
  directions.searchParams.set('api','1');directions.searchParams.set('origin',`${origin.lat},${origin.lng}`);directions.searchParams.set('destination',restaurant.address);
  const date = new Date(restaurant.price.checkedAt+'T12:00:00Z').toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric',timeZone:'UTC'});
  byId('detailsContent').innerHTML = `<div class="eyebrow">${escapeHTML(restaurant.cuisines.join(' · '))}</div><h2 class="detail-title" id="detailTitle">${escapeHTML(restaurant.name)}</h2><p class="detail-meta">${escapeHTML(restaurant.address)}</p>
    <div class="detail-image-wrap" data-kind="${imageKind(restaurant)}" style="background:${imageBackground(restaurant)}"><img src="${state.images[restaurant.id]}" alt="${escapeHTML(restaurant.imageAlt)}"></div>
    <p class="detail-note">${escapeHTML(restaurant.description)}</p>
    <div class="detail-price"><p class="price-line" aria-label="Price level: ${priceLabels[priceLevel(restaurant)]}">${priceSymbols(restaurant)} <small>${priceLabels[priceLevel(restaurant)]}</small></p><p>${escapeHTML(restaurant.price.summary)} Prices exclude tax, tip, drinks, and extras.</p><p>Menu checked ${escapeHTML(date)} · <a class="text-link price-source" href="${escapeHTML(externalLink(restaurant.price.sourceUrl))}" ${externalAttrs}>Price source ${icon('external')}</a></p></div>
    <div class="detail-actions"><a class="btn btn-green" href="${escapeHTML(externalLink(restaurant.menuUrl))}" ${externalAttrs}>View full menu ${icon('external')}</a><a class="btn" href="${escapeHTML(directions.href)}" ${externalAttrs}>Directions ${icon('external')}</a><a class="btn" href="${escapeHTML(externalLink(restaurant.websiteUrl))}" ${externalAttrs}>Website</a></div>
    <p class="caption">${restaurant.distanceMiles === null ? 'Distance not confirmed.' : `${restaurant.distanceMiles.toFixed(1)} mi. Distances are straight-line estimates; travel routes may differ.`}</p>
    <section class="detail-section"><h3>Dietary options</h3><dl class="dietary-table">${Object.entries(dietNames).map(([key,label]) => {const status=dietaryStatus(restaurant,key);return `<div class="dietary-cell"><dt>${label}</dt><dd><span class="badge ${status === 'limited' ? 'limited' : status === 'yes' ? '' : 'neutral'}">${statusNames[status]}</span></dd></div>`;}).join('')}</dl><p class="detail-note">${escapeHTML(restaurant.dietaryNote)}</p></section>
    <section class="detail-section"><h3>A few items from the menu</h3><ul class="meal-list">${restaurant.sampleMeals.map(meal => `<li><span>${escapeHTML(meal.name)}${meal.dietary.length ? `<small>Listed options: ${meal.dietary.map(key => dietNames[key]).join(' · ')}</small>` : ''}</span><span>${money(meal.price)}</span></li>`).join('')}</ul><p class="detail-note">These are menu examples, before tax, tip, drinks, and extras. Prices and availability can change. Check the full menu for ingredients and portions.</p></section>
    <p class="detail-note">${escapeHTML(restaurant.dietarySource)}</p><p class="detail-note">Image: <a href="${escapeHTML(externalLink(restaurant.imageSourceUrl))}" ${externalAttrs}>${escapeHTML(restaurant.imageCredit)}</a>.</p>`;
  byId('restaurantDetails').showModal();byId('restaurantDetails').scrollTop=0;byId('closeDetails').focus();
}
function initializeRestaurants() {
  state.images = JSON.parse(byId('restaurant-images').textContent);
  [...new Set(restaurants.flatMap(item => item.cuisines))].sort().forEach(cuisine => byId('cuisineFilter').add(new Option(cuisine,cuisine)));
  ['cuisineFilter','priceFilter','dietaryFilter','distanceFilter','sortSelect'].forEach(id => byId(id).addEventListener('change',() => renderRestaurants()));
  byId('clearFilters').addEventListener('click',clearFilters);
  byId('restaurantGrid').addEventListener('click',event => {
    const details = event.target.closest('[data-details]');
    if (details) showDetails(details.dataset.details,details);
    else if (event.target.closest('[data-clear]')) clearFilters();
  });
  byId('closeDetails').addEventListener('click',() => byId('restaurantDetails').close());
  byId('restaurantDetails').addEventListener('click',event => {if (event.target === byId('restaurantDetails')) {const rect = event.target.getBoundingClientRect();if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) event.target.close();}});
  byId('restaurantDetails').addEventListener('close',() => {if (state.lastDetailTrigger?.isConnected) state.lastDetailTrigger.focus();});
  renderRestaurants();
}

</script>

</script>
